[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fishfluencer"
version = "0.1.0"
description = "AI Fish Monitor & Social Media Poster"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "opencv-python>=4.8.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
coral = [
    "pycoral>=2.0.0",
    "tflite-runtime>=2.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
