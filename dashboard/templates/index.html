<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishFluencer Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; margin: 2rem; }
        h1 { color: #00d4ff; }
        .status { background: #16213e; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
        .label { color: #a8a8a8; font-size: 0.9rem; }
        .value { font-size: 1.4rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🐟 FishFluencer — Jordan's Dashboard</h1>
    <div class="status">
        <div class="label">Water Temperature</div>
        <div class="value" id="temp">--°F</div>
    </div>
    <div class="status">
        <div class="label">Current Behavior</div>
        <div class="value" id="behavior">--</div>
    </div>
    <div class="status">
        <div class="label">Last Post</div>
        <div class="value" id="post">--</div>
    </div>
</body>
</html>
