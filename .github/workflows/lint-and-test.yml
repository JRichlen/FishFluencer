name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check src tests

      - name: Pytest — collection only
        run: |
          set -x
          python -m pytest --collect-only -q || {
            echo "::error::pytest collection failed with exit $?"
            exit 1
          }

      - name: Pytest — run tests (with full output capture)
        run: |
          set -x
          python -m pytest -v --tb=long -ra -p no:cacheprovider 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          echo "::notice::pytest exit code = $status"
          if [ "$status" -ne 0 ]; then
            echo "=== pytest.log (last 200 lines) ==="
            tail -200 /tmp/pytest.log
            echo "::error::pytest failed with exit $status"
            exit "$status"
          fi
