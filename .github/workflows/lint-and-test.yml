name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check src tests

      - name: Pytest — collection only
        if: always()
        run: |
          set +e
          python -m pytest --collect-only -v 2>&1 | tee /tmp/collect.log
          status=${PIPESTATUS[0]}
          {
            echo "## Pytest collect-only (status=$status)"
            echo ""
            echo '```'
            cat /tmp/collect.log
            echo '```'
            echo ""
            echo "### sys.path probe"
            python -c "import sys; [print(p) for p in sys.path]" 2>&1 || true
            echo ""
            echo "### import probe"
            python -c "from src.data.db import FishDB; print('src import OK')" 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Pytest — run tests
        run: |
          set +e
          python -m pytest -v --tb=long -ra -p no:cacheprovider 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          {
            echo "## Pytest run (status=$status)"
            echo ""
            echo '```'
            tail -200 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
