name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Diagnostics — pre-install
        run: |
          set -x
          python --version
          pip --version
          pwd
          ls -la
          test -f requirements.txt && echo "requirements.txt exists" || echo "MISSING requirements.txt"
          test -f pyproject.toml && echo "pyproject.toml exists" || echo "MISSING pyproject.toml"
          test -d tests && echo "tests/ exists" || echo "MISSING tests/"
          test -d src && echo "src/ exists" || echo "MISSING src/"

      - name: Install dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          pip list

      - name: Lint with ruff
        run: |
          set -x
          ruff check src tests

      - name: Run tests
        run: |
          set -x
          pytest -v --tb=long -ra
